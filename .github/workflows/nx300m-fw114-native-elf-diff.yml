name: NX300M FW114 offline native camera ELF contrast

on:
  push:
    paths:
      - '.github/workflows/nx300m-fw114-native-elf-diff.yml'
      - 'research/nx300m_fw114_native_elf_diff.py'
      - 'research/nx300m_fw114_arm_loader_abi.py'
      - 'research/nx300m_fw114_runtime_linkage_audit.py'
      - 'research/test_nx300m_fw114_runtime_linkage_audit.py'
      - 'research/test_nx300m_fw114_arm_loader_abi.py'
      - 'research/nx300m_fw114_function_proofs.py'
      - 'research/nx300m_fw114_capture_jpeg_route.py'
      - 'research/nx300m_fw114_sif_callgraph.py'
      - 'research/test_nx300m_fw114_sif_callgraph.py'
      - 'research/test_nx300m_fw114_capture_jpeg_route.py'
      - 'research/test_nx300m_fw114_function_proofs.py'
      - 'research/test_nx300m_fw114_native_elf_diff.py'
      - 'research/nx300m_unofficial_archive_acquire.py'
      - 'research/nx300m_slp_firmware_integrity.py'
  pull_request:
    paths:
      - '.github/workflows/nx300m-fw114-native-elf-diff.yml'
      - 'research/nx300m_fw114_native_elf_diff.py'
      - 'research/nx300m_fw114_arm_loader_abi.py'
      - 'research/nx300m_fw114_runtime_linkage_audit.py'
      - 'research/test_nx300m_fw114_runtime_linkage_audit.py'
      - 'research/test_nx300m_fw114_arm_loader_abi.py'
      - 'research/nx300m_fw114_function_proofs.py'
      - 'research/nx300m_fw114_capture_jpeg_route.py'
      - 'research/nx300m_fw114_sif_callgraph.py'
      - 'research/test_nx300m_fw114_sif_callgraph.py'
      - 'research/test_nx300m_fw114_capture_jpeg_route.py'
      - 'research/test_nx300m_fw114_function_proofs.py'
      - 'research/test_nx300m_fw114_native_elf_diff.py'
      - 'research/nx300m_unofficial_archive_acquire.py'
      - 'research/nx300m_slp_firmware_integrity.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-actual-camera-elves-offline:
    name: Read-only real FW1.14/1.15 UBI→ELF symbol contrast
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Run synthetic extraction and ABI fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          python3 research/test_nx300m_fw114_native_elf_diff.py
          python3 research/test_nx300m_fw114_arm_loader_abi.py
          python3 research/test_nx300m_fw114_runtime_linkage_audit.py
          python3 research/test_nx300m_fw114_function_proofs.py
          python3 research/test_nx300m_fw114_capture_jpeg_route.py
          python3 research/test_nx300m_fw114_sif_callgraph.py
          python3 research/test_nx300m_fw114_binary_delta.py

      - name: Install pinned offline UBI reader in ephemeral venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/nx300m-ubi-venv"
          "$RUNNER_TEMP/nx300m-ubi-venv/bin/pip" \
            install --disable-pip-version-check --no-input 'ubi-reader==0.8.16'
          "$RUNNER_TEMP/nx300m-ubi-venv/bin/ubireader_extract_files" --help \
            > /dev/null

      - name: Download and verify both untrusted source archives in private runner temp
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/nx300m-static-firmware"
          mkdir -m 700 -p "$dir"
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'research')
          from nx300m_unofficial_archive_acquire import fetch_one
          from nx300m_slp_firmware_integrity import inspect
          root=Path(os.environ['RUNNER_TEMP'])/'nx300m-static-firmware'
          for v in ('1.14','1.15'):
              found=fetch_one(v,root)
              result=inspect(Path(found['path']),expected_version=v)
              if result['model_from_binary']!='NX300M' or not result['all_jamcrc_ok']:
                  raise SystemExit('REJECT firmware SLP content')
              print(f'VERIFIED_OFFLINE_SOURCE=NX300M_{v}'
                    f' ZIP_SHA256={found["download_sha256"]}')
          PY

      - name: Extract two platform UBI images and compare native ELF surfaces
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          umask 077
          export PATH="$RUNNER_TEMP/nx300m-ubi-venv/bin:$PATH"
          dir="$RUNNER_TEMP/nx300m-static-firmware"
          python3 research/nx300m_fw114_native_elf_diff.py \
            --private-dir "$dir" \
            --fw114 "$dir/NX300M_FW_v1.14.zip" \
            --fw115 "$dir/NX300M_FW_v1.15.zip" \
            --summary "$GITHUB_STEP_SUMMARY" \
            | tee "$RUNNER_TEMP/nx300m-native-diff-evidence.jsonl"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'nx300m-native-diff-evidence.jsonl'
          prefix="NX300M_NATIVE_FW_DIFF_JSON "
          matching=[json.loads(s[len(prefix):]) for s in
                    p.read_text().splitlines() if s.startswith(prefix)]
          if len(matching)!=1:raise SystemExit('REJECT: missing real native diff evidence')
          report=matching[0]
          if report['source_chain_of_custody_confirmed'] or report['camera_flash_permitted']:
              raise SystemExit('REJECT false camera safety claim')
          comp=report['comparison']
          if comp['same_named_native_elf_count']<1:
              raise SystemExit('REJECT no common camera ELF library')
          if report['fw114']['internal_fw_version']!='1.14' or (
              report['fw115']['internal_fw_version']!='1.15'
          ):raise SystemExit('REJECT firmware mismatch')
          # These guards are evidence from actual SLP-validated extracted ELFs.
          route=report["capture_to_jpeg_static_route"]
          if not route["native_callsite_rechecked_on_each_version"] or (
              not route["capture_and_photo_files_sha256_identical_between_114_and_115"]
          ):
              raise SystemExit("REJECT static callsite file proof absent")
          for v in ("fw114","fw115"):
              p=route[v]
              if p["capture_recipe_calls_verified"]!=9 or (
                  p["photo_encodeycc_edges_verified"]!=8
              ) or not p["photo_to_sif_encodeycc_link"][
                  "photolib_plt_import_sif_export_mangled_equal"
              ] or not p["jpeg_sof_sampling_420_witness"]:
                  raise SystemExit("REJECT incomplete static capture-to-JPEG route")
              if p["live_encoder_receives_film_pixels_proven"] or (
                  p["camera_install_or_flash_permitted"]
              ):
                  raise SystemExit("REJECT false on-camera claim")
          if route["camera_firmware_flash_permitted"] or (
              route["firmware_abi_equivalence_proven"]
          ):
              raise SystemExit("REJECT invalid firmware readiness")
          print("PASS actual FW114/115 9 still callsites + 8 photo JPEG edges")
          required=("libmm-photo.so","libsif.so","libcapture-fw-slpcam-nx300.so")
          lookup={x["library"]:x for x in comp["compared_native_elfs"]}
          for name in required:
              if name not in lookup or (
                  "static_arm_loader_abi_comparison" not in lookup[name]
              ):
                  raise SystemExit("REJECT: ARM ABI source record missing "+name)
              a=lookup[name]["fw114_arm_loader_abi"]
              b=lookup[name]["fw115_arm_loader_abi"]
              if a["eabi"]!=5 or b["eabi"]!=5 or (
                  not a["arm32_eabi5_little_endian"]
              ) or not b["arm32_eabi5_little_endian"]:
                  raise SystemExit("REJECT: expected ARM32 EABI5 not verified")
              if lookup[name]["static_arm_loader_abi_comparison"][
                  "runtime_loader_compatibility_verified"
              ]:
                  raise SystemExit("REJECT: runtime ABI proof overstated")
              print("NX300M_ACTUAL_ARM_ABI",name,
                    "1.14",a["float_abi_eflags"],a["float_abi_attributes"],
                    "1.15",b["float_abi_eflags"],b["float_abi_attributes"])
          runtime=report["runtime_loader_libc_static_comparison"]
          if runtime["gnu_linux_cross_compiler_binary_loadable_on_camera"] or (
              runtime["firmware_flash_permitted"]
          ):
              raise SystemExit("REJECT false on-camera loadability claim")
          print("FW114_TARGET_STATIC_GLIBC_MAX",
                runtime["fw114_static_max_defined_glibc"] or "unavailable")
          print("FW115_TARGET_STATIC_GLIBC_MAX",
                runtime["fw115_static_max_defined_glibc"] or "unavailable")
          print("FW114_TARGET_CAMERA_APP_PT_INTERP",
                runtime["fw114_di_camera_app_interp"] or "unavailable")
          for x in runtime["static_libc_and_loader_file_deltas"]:
              print("FW114_TARGET_LIBC_LOADER_FILE",x["name"],
                    "present",x["both_present"],"hash_match",x["sha256_equal"])
          graph=report["version_specific_sif_jpeg_exif_callgraph"]
          if graph["inspected_version_specific_functions"]!=7 or (
              graph["firmware_flash_permitted"] or
              graph["fully_resolved_runtime_control_flow"] or
              graph["firmware114_encoder_and_exif_native_abi_verified"] or
              graph["real_picture_wizard_to_jpeg_hook_verified"]
          ):
              raise SystemExit("REJECT SIF graph missing or unsafe")
          total114=0
          for f in graph["functions"]:
              if not f["fw114_address"].startswith("0x") or (
                  not f["fw115_address"].startswith("0x")
              ):
                  raise SystemExit("REJECT missing version-local function address")
              total114+=f["fw114_direct_bl_candidates"]
              print("FW114_SIF_CALLGRAPH",f["function"],
                    "FW114",f["fw114_address"],
                    "FW115",f["fw115_address"],
                    "IDENTIFIED_LOCAL",f["fw114_identified_local_bl"],
                    "PLT_IMPORT",f["fw114_identified_plt_bl"],
                    "BL_CANDIDATES",f["fw114_direct_bl_candidates"],
                    "FUNCTION_BODY_MATCH",f["body_sha256_equal"],
                    "SYMBOLIC_CALLS_MATCH",f["symbolic_calls_equal_in_bounded_sample"])
          if total114<1:
              raise SystemExit("REJECT no FW114 SIF ARM BL call evidence")
          # These are actual version-local ARM BL -> resolved PLT JUMP_SLOT
          # imports, NOT proof of a camera-tested patch insertion point.
          by_fn={x["function"]:x for x in graph["functions"]}
          for v in ("fw114","fw115"):
              def imports(name):
                  return [x["target_symbol"] for x in by_fn[name][
                      v+"_resolved_calls"] if x["target_kind"]=="import"]
              expected_codec=("bma_open","jpeg_open","jpeg_init",
                              "jpeg_encoder","jpeg_deInit","jpeg_close")
              actual=imports("DscJfifHal::Encode(")
              if not all(x in actual for x in expected_codec):
                  raise SystemExit("REJECT "+v+" missing native jpeg codec PLT witness")
              encode=imports("DscImage::EncodeYCC(")
              exif=imports("DscImage::SaveExifImage(")
              if not any("DscJpegInstance" in x for x in encode) or (
                  not any("AllocBuffer" in x for x in encode)
              ) or not any("DscJpegInstance" in x for x in exif) or (
                  not any("GetAddress" in x for x in exif)
              ):
                  raise SystemExit("REJECT "+v+" incomplete JPEG/EXIF dispatcher boundary")
              print("PASS_FW_SIF_JPEG_CODEC_IMPORTS",v,
                    ",".join(expected_codec),
                    "BUT_NO_CAMERA_HOOK_PROVEN")
          print("PASS read-only FW114 SIF JPEG/EXIF version-specific ARM BL graph; "
                "NO runtime camera hook proof")
          print("PASS SIF EncodeYCC binding witness; camera ABI still NO-GO")
          print('PASS native ELF FW114/115 file-hash and sampled-symbol delta report')
          PY

      - name: Remove original firmware and offline extraction from runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/nx300m-static-firmware/NX300M_FW_v1.14.zip" \
                "$RUNNER_TEMP/nx300m-static-firmware/NX300M_FW_v1.15.zip"
          echo 'Original ZIPs never committed or uploaded as GitHub artifacts.'
