name: SpektraFilm actual film-profile OFFLINE bridge trial
on:
  push:
    paths:
      - '.github/workflows/spektrafilm-profile-check.yml'
      - 'research/nx300m_spektrafilm_real_profile_qa.py'
      - 'research/test_nx300m_spektrafilm_real_profile_qa.py'
      - 'scripts/nx300m_cube_to_lut18.py'
      - 'scripts/nx300m_cube_to_lut65.py'
      - 'research/nx300m_lut_grid_host.c'
      - 'research/test_nx300m_lut_grid_host.c'
      - 'research/nx300m_host_lutgrid_jpeg.c'
      - 'research/test_nx300m_host_lutgrid_jpeg.c'
      - 'research/bench_nx300m_lut65_jpeg.c'
  pull_request:
    paths:
      - '.github/workflows/spektrafilm-profile-check.yml'
      - 'research/nx300m_spektrafilm_real_profile_qa.py'
      - 'research/test_nx300m_spektrafilm_real_profile_qa.py'
      - 'scripts/nx300m_cube_to_lut18.py'
      - 'scripts/nx300m_cube_to_lut65.py'
      - 'research/nx300m_lut_grid_host.c'
      - 'research/test_nx300m_lut_grid_host.c'
      - 'research/nx300m_host_lutgrid_jpeg.c'
      - 'research/test_nx300m_host_lutgrid_jpeg.c'
      - 'research/bench_nx300m_lut65_jpeg.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spektrafilm-actual-profile-host-only:
    name: PROVIA 100F / Crystal Archive -> NX18 + NX65 (ephemeral)
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SPEKTRAFILM_COMMIT: 3bb2c2d2801ff68b92019cf1dbcbb133d60832bc
      FILM_SLUG: fujifilm_provia_100f
      PRINT_SLUG: fujifilm_crystal_archive_typeii
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python 3.13 isolated runtime (upstream not bundled)
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.13
          uv venv --python 3.13 "$RUNNER_TEMP/spektra-venv"
          uv pip install --python "$RUNNER_TEMP/spektra-venv/bin/python" --no-deps "git+https://github.com/andreavolpato/spektrafilm.git@$SPEKTRAFILM_COMMIT"
          uv pip install --python "$RUNNER_TEMP/spektra-venv/bin/python" \
            'numpy~=2.4' 'scipy~=1.17' 'colour-science~=0.4.6' \
            'scikit-image~=0.26' 'matplotlib~=3.10' 'opt-einsum~=3.4' \
            'numba~=0.64' 'OpenImageIO~=3.1.11' 'pyfftw~=0.15.0' \
            'rawpy~=0.26.1' 'exiv2~=0.18.1' 'lensfunpy~=1.18.0'

      - name: Full upstream spectral 3D LUT bake (real film/paper profiles)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spektra-output" "$RUNNER_TEMP/nx18-test"
          "$RUNNER_TEMP/spektra-venv/bin/spektrafilm-lut" build \
            --film "$FILM_SLUG" --print "$PRINT_SLUG" \
            --input srgb --output srgb --topology 1lut \
            --resolution 17 --out "$RUNNER_TEMP/spektra-output"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / "spektra-output"
          cubes = sorted(root.rglob("*.cube"))
          if len(cubes) != 1:
              raise SystemExit(f"REJECT: expected one 3D LUT, got {len(cubes)}")
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"ACTUAL_CUBE={cubes[0]}\n")
          print("SpektraFilm generated one real-profiles .cube; output is ephemeral.")
          PY

      - name: Offline 18^3 conversion, fail-closed RGB12 integrity and numerical QA
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/nx300m_cube_to_lut18.py \
            --input "$ACTUAL_CUBE" \
            --output "$RUNNER_TEMP/nx18-test/provia100f.nx18.txt" \
            --qa "$RUNNER_TEMP/nx18-test/metrics.json" \
            --source-name "SpektraFilm PROVIA 100F + Crystal Archive, upstream pinned SHA" \
            --license-id "CC-BY-SA-4.0" \
            --samples 2048 \
            --max-error-8bit 255 --mean-error-8bit 255 \
            > "$RUNNER_TEMP/nx18-test/conversion.json"
          python3 research/nx300m_spektrafilm_real_profile_qa.py \
            --report "$RUNNER_TEMP/nx18-test/metrics.json" \
            --github-summary "$GITHUB_STEP_SUMMARY" --observe-only

      - name: Measure RGB8 error concentration vs host LUT density (18³/33³/65³)
        shell: bash
        run: |
          set -euo pipefail
          python3 research/nx300m_lut_grid_diagnostics.py \
            --input "$ACTUAL_CUBE" --samples 2048 \
            --grids 18 33 65 --github-summary "$GITHUB_STEP_SUMMARY" \
            > "$RUNNER_TEMP/nx18-test/grid_report.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"nx18-test"/"grid_report.json"
          r=json.loads(p.read_text())
          for s in r["results"]:
              print(f"GRID {s['grid']}^3: peak RGB8={s['peak_8bit']} "
                    f"mean RGB8={s['mean_8bit']} "
                    f"p99 RGB8={s['p99_8bit']} "
                    f"over12={s['above_12']} "
                    f"host-table-bytes={s['rgb12_table_bytes']}")
          PY

      - name: Build high-fidelity 65^3 RGB12 file and verify host C reader
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/nx300m_cube_to_lut65.py \
            --input "$ACTUAL_CUBE" \
            --output "$RUNNER_TEMP/nx18-test/provia100f.nx65.txt" \
            --qa "$RUNNER_TEMP/nx18-test/nx65.qa.json" \
            --grid 65 --samples 2048 \
            --max-error-8bit 12 --mean-error-8bit 2 \
            --source-name "SpektraFilm PROVIA100F/Crystal Archive from pinned SHA" \
            --license-id "CC-BY-SA-4.0" \
            > "$RUNNER_TEMP/nx18-test/nx65.report.json"
          gcc -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Iresearch \
            research/test_nx300m_lut_grid_host.c \
            research/nx300m_lut_grid_host.c research/nx300m_lut18.c \
            -o "$RUNNER_TEMP/test_host_nx65_lut"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/test_host_nx65_lut" \
            65 "$RUNNER_TEMP/nx18-test/provia100f.nx65.txt"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"nx18-test"
          r=json.loads((root/"nx65.qa.json").read_text())
          print("REAL NX65 STRICT RESCALING:",r["status"],
                "grid",r["nx_grid"],
                "peak",r["metrics"]["peak_8bit"],
                "mean",r["metrics"]["mean_8bit"],
                "bytes",r["table_bytes"],
                "camera_installable",r["camera_installable"])
          assert r["status"]=="PASS_NUMERICAL_ONLY" and not r["camera_installable"]
          PY

      - name: Real SpektraFilm 65^3 LUT -> host JPEG with EXIF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          gcc -std=c11 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Iresearch \
            research/test_nx300m_host_lutgrid_jpeg.c \
            research/nx300m_host_lutgrid_jpeg.c \
            research/nx300m_lut_grid_host.c \
            research/nx300m_lut18.c \
            research/nx300m_preview_rgb.c \
            research/nx300m_host_jpeg_sink.c \
            -lm -o "$RUNNER_TEMP/test_spektrafilm_lut65_jpeg"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/test_spektrafilm_lut65_jpeg" \
            65 "$RUNNER_TEMP/nx18-test/provia100f.nx65.txt"
          echo "PASS: actual upstream PROVIA 100F spectral LUT applied to copied RGB888, encoded as new host JPEG, and output deleted."

      - name: Full-resolution host performance and memory benchmark (20.6MP)
        shell: bash
        timeout-minutes: 13
        run: |
          set -euo pipefail
          gcc -std=c11 -O3 -Wall -Wextra -Werror -Iresearch \
            research/bench_nx300m_lut65_jpeg.c \
            research/nx300m_host_lutgrid_jpeg.c \
            research/nx300m_lut_grid_host.c \
            research/nx300m_preview_rgb.c \
            research/nx300m_host_jpeg_sink.c \
            -lm -o "$RUNNER_TEMP/bench_nx65_jpeg"
          "$RUNNER_TEMP/bench_nx65_jpeg" small \
            "$RUNNER_TEMP/nx18-test/provia100f.nx65.txt" outputs \
            | tee "$RUNNER_TEMP/nx18-test/bench_small.txt"
          "$RUNNER_TEMP/bench_nx65_jpeg" full \
            "$RUNNER_TEMP/nx18-test/provia100f.nx65.txt" outputs \
            | tee "$RUNNER_TEMP/nx18-test/bench_full.txt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"nx18-test"
          entries=[]
          for name in ("bench_small.txt","bench_full.txt"):
              lines=(root/name).read_text().strip().splitlines()
              rows=[json.loads(line.removeprefix("NX65_HOST_BENCH_JSON "))
                    for line in lines if line.startswith("NX65_HOST_BENCH_JSON ")]
              if len(rows)!=1:raise SystemExit("REJECT missing benchmark data: "+name)
              v=rows[0]
              if not all(v[k] is True for k in
                 ("host_only","source_immutable","LUT_immutable",
                  "exif_app1_preserved","create_only","destination_removed")):
                  raise SystemExit("REJECT benchmark invariant failure: "+name)
              if v["camera_fw114_verified"] is not False:
                  raise SystemExit("REJECT false camera evidence")
              if v["peak_process_rss_kib"]>256*1024:
                  raise SystemExit("REJECT host RSS above 256MiB engineering guard")
              entries.append(v)
          if entries[1]["width"]*entries[1]["height"]!=5546*3714:
              raise SystemExit("REJECT wrong full-resolution workload")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as s:
              s.write("\n### 65³ real profile host 20.6MP JPEG benchmark (not camera)\n")
              s.write("| Mode | Pixels | Repeats | Median s | P95 s | Peak process RSS MiB | JPEG bytes |\n")
              s.write("|---|---:|---:|---:|---:|---:|---:|\n")
              for v in entries:
                  s.write(f'| {v["width"]}×{v["height"]} | {v["width"]*v["height"]:,}'
                          f' | {v["repeat_count"]} | {v["seconds_median"]:.3f}'
                          f' | {v["seconds_p95"]:.3f} | {v["peak_process_rss_kib"]/1024:.2f}'
                          f' | {v["jpeg_size_bytes"]:,} |\n')
          print("PASS host memory/performance metrics captured: no camera claims")
          PY

      - name: Camera firmware safety statement
        shell: bash
        run: |
          echo "HOST RESEARCH ONLY. No real NX300M FW1.14, native ABI, camera color calibration, hardware memory or flash test."
          echo "No film profile, generated .cube or NX18 LUT uploaded as an artifact."
